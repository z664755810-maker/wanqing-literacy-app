org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# 网络不稳定时快速失败，避免 gradle 长时间静默重试（默认超时 30s 太长）
systemProp.org.gradle.internal.http.connectionTimeout=20000
systemProp.org.gradle.internal.http.socketTimeout=20000
systemProp.org.gradle.internal.repository.max.retries=2
systemProp.org.gradle.internal.repository.initial.backoff=200
# 关闭不必要的构建特性，缩短 release 构建时间
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
